<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le mie liste</title>
<style>
:root{--bg:#f2f5f3;--card:#fff;--ink:#1d2b2a;--mute:#6b7a78;--acc:#2a6f8e;--line:#d9e1de;--ok:#8aa39c}
@media (prefers-color-scheme:dark){:root{--bg:#141b1a;--card:#1d2726;--ink:#e8f0ee;--mute:#92a5a2;--acc:#6bb4d3;--line:#2e3b39;--ok:#5d7570}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:26px;margin:8px 0 14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font:inherit;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;flex:1;min-width:0}
input[type=datetime-local]{flex:none;width:100%}
button.go{font:inherit;background:var(--acc);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
li:last-child{border:0}
li input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:var(--acc)}
.t{flex:1}
.d{display:block;font-size:13px;color:var(--mute)}
.done .t{text-decoration:line-through;color:var(--ok)}
.x{background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{color:var(--mute);padding:8px 0}
.del{background:none;border:0;color:var(--mute);font:inherit;text-decoration:underline;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<h1>Le mie liste</h1>
<div class="tabs" id="tabs"></div>
<div class="box row">
  <input id="newList" placeholder="Nome della nuova lista">
  <button class="go" id="addList">Crea lista</button>
</div>
<div class="box" id="current"></div>

<script>
let data = { lists: [], current: null };
try { const s = localStorage.getItem("liste-v1"); if (s) data = JSON.parse(s); } catch (e) {}
if (!data.lists.length) { data.lists.push({ id: 1, name: "Spesa", items: [] }); data.current = 1; }

function save() { try { localStorage.setItem("liste-v1", JSON.stringify(data)); } catch (e) {} }
function cur() { return data.lists.find(l => l.id === data.current) || data.lists[0]; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function fmt(v) { return new Date(v).toLocaleString("it-IT", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); }

function render() {
  const c = cur(); data.current = c.id;
  document.getElementById("tabs").innerHTML = data.lists.map(l =>
    `<button class="tab ${l.id === c.id ? "on" : ""}" data-l="${l.id}">${esc(l.name)}</button>`).join("");
  const items = c.items.map(i => `<li class="${i.done ? "done" : ""}">
    <input type="checkbox" data-c="${i.id}" ${i.done ? "checked" : ""} aria-label="Fatto">
    <span class="t">${esc(i.text)}${i.when ? `<span class="d">Promemoria: ${fmt(i.when)}</span>` : ""}</span>
    <button class="x" data-x="${i.id}" aria-label="Elimina voce">×</button></li>`).join("");
  document.getElementById("current").innerHTML = `
    <div class="row"><input id="newItem" placeholder="Aggiungi una voce a ${esc(c.name)}">
    <input id="newWhen" type="datetime-local" aria-label="Promemoria (facoltativo)">
    <button class="go" id="addItem">Aggiungi voce</button></div>
    ${c.items.length ? `<ul>${items}</ul>` : `<p class="empty">Questa lista è vuota. Scrivi la prima voce qui sopra.</p>`}
    <button class="del" id="delList">Elimina questa lista</button>`;
  save();
}

document.addEventListener("click", e => {
  const t = e.target, c = cur();
  if (t.dataset.l) { data.current = +t.dataset.l; render(); }
  else if (t.id === "addList") {
    const n = document.getElementById("newList").value.trim(); if (!n) return;
    const id = Date.now(); data.lists.push({ id, name: n, items: [] }); data.current = id;
    document.getElementById("newList").value = ""; render();
  } else if (t.id === "addItem") {
    const text = document.getElementById("newItem").value.trim(); if (!text) return;
    const when = document.getElementById("newWhen").value;
    c.items.push({ id: Date.now(), text, when, done: false }); render();
  } else if (t.dataset.c) {
    const i = c.items.find(x => x.id === +t.dataset.c); i.done = t.checked; render();
  } else if (t.dataset.x) {
    c.items = c.items.filter(x => x.id !== +t.dataset.x); render();
  } else if (t.id === "delList") {
    if (confirm("Eliminare la lista \"" + c.name + "\"?")) {
      data.lists = data.lists.filter(l => l.id !== c.id);
      if (!data.lists.length) data.lists.push({ id: Date.now(), name: "Spesa", items: [] });
      data.current = data.lists[0].id; render();
    }
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "newItem") document.getElementById("addItem").click();
  if (e.key === "Enter" && e.target.id === "newList") document.getElementById("addList").click();
});
render();
</script>
</body>
</html>
